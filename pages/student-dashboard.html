<!-- pages/student-dashboard.html — لوحة الطالب -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحتي — منصة إدارة المدارس</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="app-shell" id="layout-root">
  <div class="main-area">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn btn-outline sidebar-toggle" id="sidebar-toggle-btn">☰</button>
        <h2 id="page-title">لوحتي</h2>
      </div>
      <div class="user-chip">👋 <span id="userNameChip"></span></div>
    </div>

    <div class="content">
      <div class="stat-grid" id="studentStats"></div>

      <div class="chart-grid" style="grid-template-columns:1fr 1fr;">
        <div class="card">
          <h3 style="margin-bottom:12px;">جدول اليوم</h3>
          <table><tbody id="todayTimetable"></tbody></table>
        </div>
        <div class="card">
          <h3 style="margin-bottom:12px;">آخر الدرجات</h3>
          <table><tbody id="recentGrades"></tbody></table>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <h3 style="margin-bottom:12px;">آخر الإشعارات</h3>
        <div id="recentNotifs"></div>
      </div>
    </div>
  </div>
</div>

<script src="../js/supabase-client.js"></script>
<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/pages/ui-helpers.js"></script>
<script src="../js/pages/student-dashboard.js"></script>
</body>
</html>
