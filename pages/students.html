<!-- pages/students.html — إدارة الطلاب والفصول -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الطلاب والفصول — منصة إدارة المدارس</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="app-shell" id="layout-root">
  <div class="main-area">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn btn-outline sidebar-toggle" id="sidebar-toggle-btn">☰</button>
        <h2 id="page-title">الطلاب والفصول</h2>
      </div>
      <div class="user-chip">👋 <span id="userNameChip"></span></div>
    </div>

    <div class="content">
      <div class="tabs">
        <button class="tab-btn active" data-tab="tab-students">🎓 الطلاب</button>
        <button class="tab-btn" data-tab="tab-classes">🏫 الفصول</button>
      </div>

      <!-- تبويب الطلاب -->
      <div class="tab-panel active" id="tab-students">
        <div class="card">
          <div class="card-header">
            <h3>قائمة الطلاب</h3>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <input type="text" id="studentSearch" placeholder="بحث بالاسم..." style="padding:8px 12px;border:1px solid var(--color-border);border-radius:8px;font-size:13px;">
              <select id="classFilter" style="padding:8px 12px;border:1px solid var(--color-border);border-radius:8px;font-size:13px;"><option value="">كل الفصول</option></select>
              <button class="btn btn-outline btn-sm" id="downloadTemplateBtn">⬇️ نموذج CSV</button>
              <button class="btn btn-outline btn-sm" id="importCsvBtn">📥 استيراد لائحة CSV</button>
              <input type="file" id="csvFileInput" accept=".csv" style="display:none;">
              <button class="btn btn-primary btn-sm" id="addStudentBtn">+ إضافة طالب</button>
            </div>
          </div>
          <table>
            <thead><tr><th>الاسم</th><th>الفصل</th><th>ولي الأمر</th><th>هاتف ولي الأمر</th><th>الحالة</th><th></th></tr></thead>
            <tbody id="studentsTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- تبويب الفصول -->
      <div class="tab-panel" id="tab-classes">
        <div class="card">
          <div class="card-header">
            <h3>قائمة الفصول</h3>
            <button class="btn btn-primary btn-sm" id="addClassBtn">+ إضافة فصل</button>
          </div>
          <table>
            <thead><tr><th>الفصل</th><th>المستوى</th><th>عدد الطلاب / السعة</th><th>المدرس المسؤول</th><th></th></tr></thead>
            <tbody id="classesTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal إضافة/تعديل طالب -->
<div class="modal-overlay" id="studentModal">
  <div class="modal-box">
    <h3 id="studentModalTitle">إضافة طالب</h3>
    <input type="hidden" id="studentId">
    <div class="field"><label>الاسم الكامل</label><input type="text" id="studentName"></div>
    <div class="field"><label>تاريخ الميلاد</label><input type="date" id="studentBirth"></div>
    <div class="field"><label>الفصل</label><select id="studentClass"></select></div>
    <div class="field"><label>عنوان السكن</label><input type="text" id="studentAddress" placeholder="الحي، المدينة..."></div>

    <hr style="border:none;border-top:1px solid var(--color-border);margin:14px 0;">
    <p style="font-size:12.5px;color:var(--color-text-muted);margin-bottom:10px;">معلومات ولي الأمر</p>

    <div class="field"><label>اختيار ولي أمر موجود</label>
      <select id="studentParent"><option value="">— بدون / إدخال جديد أدناه —</option></select>
    </div>
    <div class="field"><label>أو اسم ولي أمر جديد</label><input type="text" id="newParentName" placeholder="اتركه فارغًا إن اخترت ولي أمر موجود"></div>
    <div class="field"><label>هاتف ولي الأمر (لإشعارات واتساب)</label><input type="tel" id="newParentPhone" placeholder="مثال: 0600000000"></div>

    <div class="field"><label>الحالة</label>
      <select id="studentStatus"><option value="active">مسجّل</option><option value="inactive">غير نشط</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="cancelStudentBtn">إلغاء</button>
      <button class="btn btn-primary" id="saveStudentBtn">حفظ</button>
    </div>
  </div>
</div>

<!-- Modal إضافة/تعديل فصل -->
<div class="modal-overlay" id="classModal">
  <div class="modal-box">
    <h3 id="classModalTitle">إضافة فصل</h3>
    <input type="hidden" id="classId">
    <div class="field"><label>اسم الفصل</label><input type="text" id="className"></div>
    <div class="field"><label>المستوى</label><input type="text" id="classLevel" placeholder="مثال: إعدادي"></div>
    <div class="field"><label>السعة القصوى</label><input type="number" id="classCapacity" value="30"></div>
    <div class="field"><label>المدرس المسؤول</label><select id="classTeacher"><option value="">— بدون —</option></select></div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="cancelClassBtn">إلغاء</button>
      <button class="btn btn-primary" id="saveClassBtn">حفظ</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="../js/supabase-client.js"></script>
<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/pages/ui-helpers.js"></script>
<script src="../js/pages/students.js"></script>
</body>
</html>
