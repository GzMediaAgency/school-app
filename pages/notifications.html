<!-- pages/notifications.html — مركز الإشعارات -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإشعارات — منصة إدارة المدارس</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .notif-item { display:flex; align-items:flex-start; gap:12px; padding:14px; border-bottom:1px solid var(--color-border); }
  .notif-dot { width:9px; height:9px; border-radius:50%; background:var(--color-primary-blue); margin-top:6px; flex-shrink:0; }
  .notif-item.read .notif-dot { background:transparent; }
  .notif-msg { flex:1; font-size:13.5px; }
  .notif-meta { font-size:11.5px; color:var(--color-text-muted); margin-top:4px; }
</style>
</head>
<body>

<div class="app-shell" id="layout-root">
  <div class="main-area">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn btn-outline sidebar-toggle" id="sidebar-toggle-btn">☰</button>
        <h2 id="page-title">الإشعارات</h2>
      </div>
      <div class="user-chip">👋 <span id="userNameChip"></span></div>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-header">
          <h3>كل الإشعارات</h3>
          <button class="btn btn-outline btn-sm" id="markAllReadBtn">تعليم الكل كمقروء</button>
        </div>
        <div id="notifList"></div>
      </div>
    </div>
  </div>
</div>

<script src="../js/supabase-client.js"></script>
<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/pages/ui-helpers.js"></script>
<script src="../js/pages/notifications.js"></script>
</body>
</html>
