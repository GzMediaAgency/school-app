<!-- pages/admin-dashboard.html — لوحة تحكم المدير: إحصائيات ورسوم بيانية -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم — منصة إدارة المدارس</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

<div class="app-shell" id="layout-root">
  <div class="main-area">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn btn-outline sidebar-toggle" id="sidebar-toggle-btn">☰</button>
        <h2 id="page-title">لوحة التحكم</h2>
      </div>
      <div class="user-chip">👋 مرحبًا، <span id="userNameChip"></span></div>
    </div>

    <div class="content">
      <div class="stat-grid" id="statGrid"></div>

      <div class="chart-grid">
        <div class="chart-card">
          <h3>توزيع الطلاب حسب الفصل</h3>
          <canvas id="classChart" height="220"></canvas>
        </div>
        <div class="chart-card">
          <h3>نسبة الحضور — آخر 7 أيام</h3>
          <canvas id="attendanceChart" height="220"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/supabase-client.js"></script>
<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/pages/ui-helpers.js"></script>
<script src="../js/pages/admin-dashboard.js"></script>
</body>
</html>
